# Provider profile template.
#
# Copy this to <provider>.conf (e.g. fastmail.conf) and fill in the server
# details. Connection details ONLY — NEVER put a password or any personal
# data in a provider profile; these files are committed and public.
#
# Adding a provider is just adding one of these files. No code changes:
# the email engine speaks standard IMAP, so any IMAP-capable provider works.

# Presentation (used by the setup wizard; ingest engines ignore these).
# LABEL: display name in the wizard's provider picker. APP_PASSWORD_HINT:
# shown to the user before the password prompt — where to create one.
LABEL=Example
APP_PASSWORD_HINT=Create an app-specific password in your provider's security settings.

IMAP_HOST=imap.example.com
IMAP_PORT=993
IMAP_SSL=true

# SMTP_HOST=smtp.example.com
# SMTP_PORT=465
# SMTP_SSL=true

# Authentication method. Only "password" is supported for now; any other
# value fails fast at startup.
AUTH=password
