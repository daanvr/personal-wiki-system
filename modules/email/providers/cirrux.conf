# Cirrux provider profile.
#
# Connection details ONLY. No passwords, no personal data — this file is
# committed and public. The account address and password live elsewhere
# (see ../config.example and SECRET_REF).
#
# VERIFY THESE before first use: open Cirrux → Settings → Mail / "Connect an
# app" (IMAP) and confirm the incoming server host and port. The host below
# is a best guess based on the cirrux.co domain and may be wrong; the
# `check` command will tell you immediately if it can't connect.

IMAP_HOST=imap.cirrux.co
IMAP_PORT=993
IMAP_SSL=true

# Outgoing mail (SMTP) is unused while this module is read-only. Left here,
# commented, for whenever sending is added.
# SMTP_HOST=smtp.cirrux.co
# SMTP_PORT=465
# SMTP_SSL=true

# Authentication method. "password" (the only supported value — anything
# else fails fast) means plain LOGIN over the TLS connection; use a Cirrux
# app-specific password, not your main one.
AUTH=password
