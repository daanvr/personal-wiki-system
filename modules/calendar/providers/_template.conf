# Provider profile template.
#
# Copy this to <provider>.conf and fill in the server details. Connection
# details ONLY — NEVER put a password or any personal data in a provider
# profile; these files are committed and public.
#
# Adding a provider is just adding one of these files. No code changes:
# the calendar engine speaks standard CalDAV, so any CalDAV-capable provider
# should work.

# Presentation (used by the setup wizard; ingest engines ignore these).
# LABEL: display name in the wizard's provider picker. APP_PASSWORD_HINT:
# shown to the user before the password prompt — where to create one.
LABEL=Example
APP_PASSWORD_HINT=Create an app-specific password in your provider's security settings.

CALDAV_URL=https://caldav.example.com/

# Authentication method. "password" (the only supported value — anything
# else fails fast) means Basic auth over HTTPS using an app-specific
# password when the provider supports it.
AUTH=password
