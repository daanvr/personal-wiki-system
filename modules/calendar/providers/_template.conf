# Provider profile template.
#
# Copy this to <provider>.conf and fill in the server details. Connection
# details ONLY — NEVER put a password or any personal data in a provider
# profile; these files are committed and public.
#
# Adding a provider is just adding one of these files. No code changes:
# the calendar engine speaks standard CalDAV, so any CalDAV-capable provider
# should work.

CALDAV_URL=https://caldav.example.com/

# Authentication method. "password" means Basic auth over HTTPS using an
# app-specific password when the provider supports it.
AUTH=password
